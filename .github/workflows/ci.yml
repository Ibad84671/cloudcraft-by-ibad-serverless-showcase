name: CloudCraft CI

on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate infrastructure and application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check cfn-lint
      - name: Validate CloudFormation
        run: cfn-lint infrastructure/cloudformation/template.yaml
      - name: Check JavaScript syntax
        run: |
          node --check src/lambda/get-items.js
          node --check src/lambda/put-items.js
      - name: Check frontend markers
        run: |
          test -f src/index.html
          grep -q 'CloudCraft' src/index.html
          grep -q 'CloudFormation' src/index.html
      - name: Scan IaC with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/cloudformation
          framework: cloudformation
          soft_fail: false
